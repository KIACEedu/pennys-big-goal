.dmdots i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.dmdots i.on{background:var(--gold)}.dmdots i.done{background:var(--green)}
.dmlearn{display:inline-block;background:#E8F7E4;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font:600 15px var(--display);margin:2px 0 12px}
.dmnav{justify-content:space-between;margin-top:14px}
.dmok{outline:5px solid var(--green);outline-offset:2px}
.dmno{outline:5px solid var(--red);outline-offset:2px}
.dmtag{display:block;margin-top:6px;font:700 15px var(--display);border:2px solid var(--ink);border-radius:999px;padding:1px 10px}
.dmgoal{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;margin:4px 0 12px}
.dmgoal svg{width:52px;height:52px}
.dmchips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dmchip{font:600 18px var(--display);border:3px solid var(--ink);border-radius:16px;padding:14px 10px;background:var(--card);cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.dmchip.lockd{background:#FFE3EC}.dmchip.lockd::before{content:"🔒 "}
.dmchip.okd{background:#DFF3DF}.dmchip.okd::before{content:"✅ "}
.dmskills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin:8px 0 4px}
.dmskills div{border:3px solid var(--ink);border-radius:14px;padding:10px;background:var(--card)}
.dmskills b{display:block;font:700 17px var(--display)}
.dmskills span{font-size:14px;color:var(--soft);font-weight:800}
.dmstart{background:var(--purple)!important;color:#fff}
.dmready{animation:dmpulse 1.3s ease-in-out infinite}@keyframes dmpulse{0%,100%{box-shadow:0 4px 0 var(--ink),0 0 0 0 rgba(255,197,51,.9)}50%{box-shadow:0 4px 0 var(--ink),0 0 0 10px rgba(255,197,51,0)}}
.dmcauses{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.dmcauses .choice svg{width:64px;height:64px}
.dmcauses .choice h3{font-size:17px}
@media (max-width:560px){.dmcauses{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dmsoon{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}@media (max-width:640px){.dmsoon{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dmsoon div{border:3px dashed var(--ink);border-radius:14px;padding:10px;background:var(--cream)}
.dmsoon b{display:block;font:700 17px var(--display)}
.dmsoon span{font-size:14px;color:var(--soft);font-weight:800}
.dmbadge{display:inline-block;background:var(--purple);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font:700 14px var(--display);transform:rotate(-2deg)}
@media (max-width:420px){.dmchips{grid-template-columns:1fr}}
</style>
<script>/* PHASE5 · DEMO MODE (v2)
   A fast, click-through tour for presentations (~40 seconds).
   Shows: quality control, give/tithe first, saving, the share jar, need vs want, spending,
   supporting a friend's business, online safety, and a "grown-up money: coming soon" teaser.
   Self-contained: it never changes a player's stars, badges, jars or saved progress.
   Start it: "30-sec demo" on the title screen, add #demo to the link, or press D on the title screen.
   While running: → or Space = next, Esc = exit. */
(function(){
const DM={on:false,i:0,auto:false,tok:0,done:false};
const later2=(fn,ms)=>{const t=DM.tok;setTimeout(()=>{if(DM.on&&t===DM.tok)fn()},ms)};
const N=8;
const GW=()=>giveWord();                       // "Tithe" or "Give" (family setting)
const isTithe=()=>GW()==='Tithe';
const dots=i=>`<span class="dmdots" aria-label="Step ${i} of ${N}">${Array.from({length:N},(_,k)=>`<i class="${k+1<i?'done':k+1===i?'on':''}"></i>`).join('')}</span>`;
function frame(i,skill,h2,learn,body){
 show(`<div class="dmtop"><span class="eyebrow">⚡ Quick demo · ${i} of ${N} · ${skill}</span>${dots(i)}</div>
  <h2>${h2}</h2><span class="dmlearn">Kids learn: ${learn}</span>${body}
  <div class="row dmnav"><button class="btn small" data-demo="exit">Exit demo</button><button class="btn small go" data-demo="next">Next ▶</button></div>`)}
function shakeEl(el){if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function win(line){DM.done=true;say(line,true);const n=scene.querySelector('[data-demo="next"]');if(n)n.classList.add('dmready')}
/* speech: in the demo Penny finishes every sentence (lines queue instead of cutting each other off) */
const whenQuiet=(fn,pad)=>{const t=DM.tok;const tick=()=>{if(!DM.on||t!==DM.tok)return;let busy=false;try{busy=SET.voice&&(speechSynthesis.speaking||speechSynthesis.pending)}catch(e){}
 if(busy)setTimeout(tick,250);else setTimeout(()=>{if(DM.on&&t===DM.tok)fn()},SET.voice?pad:pad+1200)};setTimeout(tick,400)};
function hush(){try{speechSynthesis.cancel()}catch(e){}try{if(clip){clip.pause();clip=null}}catch(e){}}
const speak5=speak;speak=function(t){if(!DM.on)return speak5(t);let real=null;try{real=speechSynthesis.cancel;speechSynthesis.cancel=function(){}}catch(e){}
 try{speak5(t)}finally{try{delete speechSynthesis.cancel;if(speechSynthesis.cancel!==real)speechSynthesis.cancel=real}catch(e){}}};
const SKILLS=()=>[['🔍 Quality control','Check your work before you sell','Found and fixed a mistake'],
 [`🙏 ${isTithe()?'Tithe':'Give'} first`,'The first coin goes to giving','Gave the first coin first'],
 ['🐷 Saving','Every coin has a job','Hit a $20 goal'],
 ['💗 Share jar','Food, shelter, church, friends','Chose where to share'],
 ['🛒 Need vs want','Needs come first','Put needs first'],
 ['💳 Spending','Spend within your jar','Stayed inside the Spend jar'],
 ['🤝 Support friends','Buy from a friend\'s business','Helped a friend\'s business grow'],
 ['🔒 Online safety','What never to share','Kept private info private']];

/* ---------- 0 · intro ---------- */
function intro(){DM.i=0;DM.done=false;
 say('Hi! I\'m Penny. Here\'s a quick peek at what kids learn in my game!',true);
 show(`<span class="eyebrow">⚡ Presenter demo · under a minute</span><h2>What kids learn with Penny</h2>
  <div class="dmskills">${SKILLS().map(([b,s])=>`<div><b>${b}</b><span>${s}</span></div>`).join('')}<div style="border-style:dashed;background:var(--cream)"><b>🏦 Grown-up money</b><span>Coming soon</span></div></div>
  <div class="row" style="margin-top:14px"><button class="btn go" data-demo="start">Start the tour ▶</button><button class="btn dmstart" data-demo="auto">Auto-answer (I press Next)</button><button class="btn small" data-demo="exit">Back</button></div>
  <p class="note" style="text-align:center;margin-top:10px">Penny finishes every line, then waits for you. Tap an answer, or use Auto-answer and just press Next when you're ready. Keyboard: → next · Esc exit.</p>`)}

/* ---------- 1 · quality control ---------- */
let qc;
function quality(){DM.done=false;
 const ps=[{who:'dino',doing:'pizza',where:'space'},{who:'unicorn',doing:'fly',where:'castle'},{who:'puppy',doing:'dance',where:'beach'},{who:'dino',doing:'fly',where:'beach'}];
 qc={ps,bad:Math.floor(Math.random()*4)};
 say('Quality check! One printed page has a smudge. Can you find it before we sell?');
 renderQC()}
function renderQC(fixed){
 frame(1,'Quality control','Find the smudged page','checking your work keeps customers happy',
  `<div class="duo dmq">${qc.ps.map((p,i)=>`<button class="pagebtn ${fixed&&i===qc.bad?'dmok':''}" data-demo="qc:${i}" aria-label="Printed page ${i+1}">${pageArt(p,{},!fixed&&i===qc.bad)}</button>`).join('')}</div>`)}
function qcTap(i){if(DM.done)return;
 if(+i===qc.bad){renderQC(true);confetti(20);win('Found it and reprinted it! Quality work earns happy customers.')}
 else{say('That page looks clean. Look for the gray smudge!');shakeEl(scene.querySelector(`[data-demo="qc:${i}"]`))}}

/* ---------- 2 · give / tithe first ---------- */
let gv;
const PAY=[100,200,200,500];                  // $10 payday
function giveFirst(){DM.done=false;gv={given:false};
 say(isTithe()?'Payday! You earned $10. Before anything else, your first $1 is your tithe. Tap the shiny coin!':'Payday! You earned $10. Before anything else, your first $1 goes to giving. Tap the shiny coin!');renderGive()}
function renderGive(){
 frame(2,isTithe()?'Tithe first':'Give first',isTithe()?'Pay your tithe first':'Give first','give first with a happy heart: about one tenth of what you earn',
  `<p style="margin:0 0 6px">You earned <b>${money(1000)}</b> today.</p>
  <div class="coins">${PAY.map((c,i)=>i===0?(gv.given?'':`<button class="coin c${c} sparkle" data-demo="give" aria-label="Give the first coin">${coinLbl(c)}</button>`):`<span class="coin c${c}" style="opacity:${gv.given?1:.5}">${coinLbl(c)}</span>`).join('')}</div>
  <div class="jars" style="max-width:200px;margin:8px auto 0"><div class="card jarbtn ${gv.given?'dmok':''}" style="cursor:default"><div class="glass"><div class="lid" style="background:${C.green}"></div><div class="lvl" style="background:${C.green};height:${gv.given?40:0}%"></div></div>
   <small>${GW()}</small><b>${money(gv.given?100:0)}</b><span class="note">${isTithe()?'My tithe':'Give first'}</span></div></div>
  ${gv.given?`<p class="feedback" style="background:#DFF3DF;margin-top:12px">$1 of $10 is one tenth. Giving first shows what matters most.</p>`:''}`)}
function giveTap(){if(DM.done||gv.given)return;gv.given=true;renderGive();confetti(25);
 win(isTithe()?'Wonderful! Your tithe comes first. Now let\'s give the rest of your coins a job.':'Wonderful! Giving comes first. Now let\'s give the rest of your coins a job.',1700)}

/* ---------- 3 · saving ---------- */
const GOAL=2000;let sv;
function saving(){DM.done=false;sv={saved:1500,jars:{save:1500,spend:300,share:200},put:null};
 say('Now sort the rest! Penny wants a new bike. Which jar gets you there?');renderSave()}
function renderSave(){const pct=Math.min(100,(sv.put?sv.saved-500:sv.saved)/GOAL*100),tot=sv.jars.save+sv.jars.spend+sv.jars.share;
 frame(3,'Saving','Where does your $5 go?','every coin has a job, and saving reaches goals',
  `<div class="dmgoal">${svgA('bike')}<div class="bar" role="progressbar" aria-label="Savings toward the bike" aria-valuenow="${Math.round(pct)}"><div class="fill" id="dmfill" style="width:${pct}%"></div></div><b style="font:700 17px var(--display)">${money(sv.saved)} / ${money(GOAL)}</b></div>
  <div class="coins">${sv.put?'':'<span class="coin c500 sparkle" aria-label="Five dollars">$5</span>'}</div>
  <div class="jars">${[['save','Save',C.gold,'For your goal'],['spend','Spend',C.blue,'For fun and needs'],['share','Share',C.pink,'To help others']].map(([k,n,col,d])=>`
   <button class="card jarbtn ${sv.put===k?'dmok':''}" data-demo="jar:${k}" aria-label="${n} jar"><div class="glass"><div class="lid" style="background:${col}"></div><div class="lvl" style="background:${col};height:${sv.jars[k]/tot*85}%"></div></div>
   <small>${n}</small><b>${money(sv.jars[k])}</b><span class="note">${d}</span></button>`).join('')}</div>`)}
function jarTap(k){if(DM.done)return;
 if(k!=='save'){say(k==='spend'?'Spend is for fun and needs. To reach the bike, the coin goes in Save!':'Sharing is kind! But to reach the bike, this coin goes in Save.');shakeEl(scene.querySelector(`[data-demo="jar:${k}"]`));return}
 sv.put='save';sv.jars.save+=500;sv.saved+=500;renderSave();
 requestAnimationFrame(()=>requestAnimationFrame(()=>{const f=$('dmfill');if(f)f.style.width=Math.min(100,sv.saved/GOAL*100)+'%'}));
 confetti(40);win('Goal reached! $20 saved. Saving turns a wish into a plan.',1700)}

/* ---------- 4 · share jar ---------- */
const FRIEND_ART=`<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="36" cy="40" r="16" fill="#C68642" ${st}/><circle cx="66" cy="40" r="16" fill="#F1C27D" ${st}/><path d="M12 92 Q14 62 36 60 Q50 60 52 70 Q54 60 66 60 Q88 62 88 92Z" fill="${C.pink}" ${st}/><path d="M50 30 C42 22 44 14 48 14 C50 14 50 16 50 17 C50 16 51 14 53 14 C57 14 58 22 50 30Z" fill="${C.red}" stroke="${C.ink}" stroke-width="2"/></svg>`;
const SHARE=[['food','Food bank',svgA('foodbank'),'Your $2 helps pack lunches for kids!'],['shelter','Shelter',svgA('shelter'),'Your $2 helps give warm meals and a safe place to sleep!'],['church','Church',svgA('church'),'Your $2 helps your church care for families!'],['friend','A friend in need',FRIEND_ART,'Your $2 helps a friend who is having a hard week!']];
let sh;
function sharing(){DM.done=false;sh={pick:null};say('Your Share jar has $2. Who will you help? Every choice is a good one!');renderShare()}
function renderShare(){const c=SHARE.find(x=>x[0]===sh.pick);
 frame(4,'Share jar','Your Share jar has $2. Who will you help?','sharing helps people: food, shelter, church, or a friend',
  `<div class="dmcauses">${SHARE.map(([k,n,art])=>`<button class="card choice ${sh.pick===k?'dmok':''}" data-demo="sh:${k}">${art}<h3>${n}</h3></button>`).join('')}</div>
  ${c?`<p class="feedback" style="background:#FFE3EC;margin-top:12px">💗 ${c[3]}</p>`:''}`)}
function shareTap(k){if(DM.done)return;sh.pick=k;renderShare();confetti(25);
 win(SHARE.find(x=>x[0]===k)[3]+' Sharing makes our whole community stronger.',2000)}

/* ---------- 5 · need vs want ---------- */
let nw;
function needWant(){DM.done=false;nw={picked:null};say('Surprise! Your pencil broke and there\'s homework tonight. A new game is on the shelf too. Which one is a NEED?');renderNW()}
function renderNW(){const items=[['pencil','School pencil','Your pencil broke. Homework tonight!',50,true],['game','Video game','A cool new game is on the shelf.',300,false]];
 frame(5,'Need vs want','Which one is a NEED?','needs keep us safe and healthy; wants can wait',
  `<div class="choices" style="grid-template-columns:repeat(2,minmax(0,1fr))">${items.map(([id,n,t,p,need])=>`<button class="card choice ${nw.picked&&need?'dmok':''}" data-demo="nw:${need?1:0}">${svgA(id)}<h3>${n}</h3><small>${t}</small><span class="price">${money(p)}</span>${nw.picked?`<span class="dmtag" style="background:${need?'#DFF3DF':'#FFE3EC'}">${need?'NEED':'WANT'}</span>`:''}</button>`).join('')}</div>`)}
function nwTap(v){if(DM.done)return;
 if(v==='1'){nw.picked=true;renderNW();win('Yes! The pencil is a need. The game is a want: fun, but it can wait.',1800)}
 else{say('That one is a want. It\'s fun, but you can live without it. Try the other one!');shakeEl(scene.querySelector('[data-demo="nw:0"]'))}}

/* ---------- 6 · spending ---------- */
let sp;
function spending(){DM.done=false;sp={ans:null};say('You have $3 in your Spend jar. The video game costs $4. What should you do?');renderSpend()}
function renderSpend(){
 frame(6,'Spending','The game is $4. Your Spend jar has $3.','spend only what\'s in your Spend jar, and protect your savings',
  `<div class="event">${svgA('game')}<div><h3 style="margin:0">Video game <span class="price">${money(400)}</span></h3>
   <div class="row" style="justify-content:flex-start;margin-top:8px;gap:14px"><span><b style="font:700 20px var(--display)">${money(300)}</b> <span class="note">in Spend</span></span><span><b style="font:700 20px var(--display)">${money(2000)}</b> <span class="note">in Save (bike)</span></span></div></div></div>
  <div class="qbtns" style="margin-top:12px"><button class="btn ${sp.ans==='wait'?'dmok':''}" data-demo="sp:wait" style="background:#DFF3DF">Wait and keep saving</button><button class="btn ${sp.ans==='raid'?'dmno':''}" data-demo="sp:raid" style="background:#FFE3EC">Take $1 from my bike savings</button></div>
  ${sp.ans==='wait'?'<p class="feedback" style="background:#DFF3DF;margin-top:12px">Smart! Next payday you\'ll have enough, and your bike money stays safe.</p>':''}`)}
function spTap(v){if(DM.done)return;
 if(v==='wait'){sp.ans='wait';renderSpend();win('Great waiting! Wants come from the Spend jar, never from your goal savings.',1900)}
 else{sp.ans='raid';renderSpend();say('Whoa! That pulls your bike goal backward. Savings are for goals and real emergencies. Try again!')}}

/* ---------- 7 · support a friend's business ---------- */
let fr;
function friend(){DM.done=false;fr={ans:null};
 say('Your bike goal is reached, so you have room to spend! Your friend Amara started a sticker business. She charges $1 a sheet. Will you support her?');renderFriend()}
function renderFriend(){const bought=fr.ans==='buy';
 frame(7,'Support friends','Amara\'s Sticker Shop','when your goal is on track, spend to support friends; their business charges a fair price',
  `<div class="event"><div>${person(11)}</div><div><h3 style="margin:0">Amara made her own sticker business!</h3>
   <div class="row" style="justify-content:flex-start;margin-top:8px;gap:10px">${svgA('stickersheet','width="56" height="56"')}<span class="price">${money(100)} a sheet</span><span><b style="font:700 20px var(--display)">${money(bought?200:300)}</b> <span class="note">in Spend</span></span></div></div></div>
  <div class="qbtns" style="margin-top:12px"><button class="btn go ${bought?'dmok':''}" data-demo="fr:buy">Buy a sheet for $1 💗</button><button class="btn ${fr.ans==='skip'?'sel':''}" data-demo="fr:skip">Maybe next time</button></div>
  ${bought?'<p class="feedback" style="background:#DFF3DF;margin-top:12px">🤝 Amara earned $1! When friends buy from each other, everyone\'s business grows.</p>':''}
  ${fr.ans==='skip'?`<p class="feedback" style="background:${C.lemon};margin-top:12px">That's okay! It's your choice. Supporting friends is great when your goal is on track.</p>`:''}`)}
function frTap(v){if(DM.done)return;fr.ans=v;renderFriend();
 if(v==='buy'){confetti(25);win('Amara says thank you! You paid her fair price from your Spend jar and helped her business grow.',2000)}
 else win('That\'s okay! Supporting friends is a great use of Spend money when your goal is on track.',1900)}

/* ---------- 8 · online safety ---------- */
const SAFE5=[['Your favorite color',true],['Your password',false],['Your home address',false],['A story idea',true]];let sf;
function safety(){DM.done=false;sf={found:new Set()};say('AI safety! Tap everything you should NEVER share with an app or AI tool.');renderSafe5()}
function renderSafe5(){const left=SAFE5.filter(x=>!x[1]).length-sf.found.size;
 frame(8,'Online safety',left?`Tap what you NEVER share (${left} left)`:'Private info stays private!','keep passwords, addresses and school names private',
  `<div class="dmchips">${SAFE5.map(([t,ok],i)=>`<button class="dmchip ${sf.found.has(i)?'lockd':(!left&&ok?'okd':'')}" data-demo="sf:${i}">${t}</button>`).join('')}</div>`)}
function sfTap(i){if(DM.done)return;i=+i;const [t,ok]=SAFE5[i];
 if(ok){say(`"${t}" is okay to share. Look for private information!`);shakeEl(scene.querySelector(`[data-demo="sf:${i}"]`));return}
 sf.found.add(i);renderSafe5();
 if(sf.found.size===SAFE5.filter(x=>!x[1]).length){confetti(30);win('Safety Star! Passwords and addresses stay private, always.',1900)}
 else say('Right! Never share that. One more!',true)}

/* ---------- coming soon · grown-up money ---------- */
function comingSoon(){DM.done=true;
 say('Coming soon: how grown-ups use money! Bills, budgets, banks, and protecting the family.',true);
 show(`<div class="dmtop"><span class="eyebrow">⚡ Quick demo · Next level</span><span class="dmbadge">Coming soon</span></div>
  <h2>Grown-up money: what grown-ups do with their money</h2><span class="dmlearn">Next: the money skills kids will need as teens and young adults</span>
  <div class="dmsoon">${[['🧾 Pay the bills','Rent, lights, phone, food'],['📋 Make a budget','A plan for every dollar'],['🛟 Emergency fund','Money for surprises'],['🏦 Banks and interest','Make money work for you'],['🌱 Invest and grow','Let time grow your money'],['🛡️ Protect the family','Insurance and a plan'],['🔮 Future Vault','Saving for grown-up you'],['🧑‍💼 Earn and build','Jobs, businesses, licenses']].map(([b,s])=>`<div><b>${b}</b><span>${s}</span></div>`).join('')}</div>
  <div class="row dmnav"><button class="btn small" data-demo="exit">Exit demo</button><button class="btn small go" data-demo="next">See the recap ▶</button></div>`);
}

/* ---------- finale ---------- */
function finale(){DM.done=true;DM.auto=false;confetti(60);
 say(`That's what kids practice with me: check your work, ${isTithe()?'tithe':'give'} first, save, share, spend wisely, support friends, and stay safe!`,true);
 show(`<span class="eyebrow">⚡ Demo complete</span><h2>In under a minute, kids practiced…</h2>
  <div class="dmskills">${SKILLS().map(([b,,d])=>`<div><b>${b}</b><span>✅ ${d}</span></div>`).join('')}</div>
  <p class="note" style="margin-top:10px">The full game adds earning, pricing, profit, banking and interest, AI skills and a grown-up dashboard across 4 levels for ages 5 to 13. Grown-up money is coming next.</p>
  <div class="words" style="margin-top:10px">${[['Earn',C.gold],[GW(),C.green],['Save',C.pink],['Share',C.pink],['Spend',C.sky],['Need',C.green],['Want',C.sky],['Quality',C.lemon],['Safety',C.green],['Grow',C.gold]].map(([w,c])=>`<span style="background:${c}">${w}</span>`).join('')}</div>
  <div class="row" style="margin-top:14px"><button class="btn small" data-demo="replay">Replay demo</button><button class="btn go" data-demo="exit">Play the full game</button></div>`)}

/* ---------- engine ---------- */
const STEPS=[intro,quality,giveFirst,saving,sharing,needWant,spending,friend,safety,comingSoon,finale];
const AUTO={
 1:()=>qcTap(qc.bad),
 2:()=>giveTap(),
 3:()=>jarTap('save'),
 4:()=>shareTap(pick(SHARE)[0]),
 5:()=>nwTap('1'),
 6:()=>spTap('wait'),
 7:()=>frTap('buy'),
 8:()=>{const priv=SAFE5.map((x,i)=>x[1]?null:i).filter(x=>x!==null);sfTap(priv[0]);whenQuiet(()=>sfTap(priv[1]),600)}};
function go(i){DM.tok++;hush();DM.i=i;DM.done=false;STEPS[i]();if(DM.auto&&AUTO[i])whenQuiet(AUTO[i],900)}
function next(){if(!DM.on)return;if(DM.i>=STEPS.length-1)return;go(DM.i+1)}
function stop(){DM.tok++;hush();DM.on=false;DM.auto=false;title()}
window.PennyDemo={start:()=>{DM.on=true;go(0)},stop};

scene.addEventListener('click',e=>{const b=e.target.closest('[data-demo]');if(!b||b.disabled)return;e.stopPropagation();
 const [k,v]=b.dataset.demo.split(':');
 if(k==='open'){DM.on=true;return go(0)}
 if(!DM.on)return;
 if(k==='start'){DM.auto=false;return go(1)}
 if(k==='auto'){DM.auto=true;return go(1)}
 if(k==='replay'){DM.auto=false;return go(0)}
 if(k==='exit')return stop();
 if(k==='next'){DM.auto=false;return next()}
 if(k==='qc')return qcTap(v);if(k==='give')return giveTap();if(k==='jar')return jarTap(v);if(k==='sh')return shareTap(v);
 if(k==='nw')return nwTap(v);if(k==='sp')return spTap(v);if(k==='fr')return frTap(v);if(k==='sf')return sfTap(v)},true);

document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,select'))return;
 if(DM.on){if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();DM.auto=false;next()}else if(e.key==='Escape')stop();return}
 if((e.key==='d'||e.key==='D')&&scene.querySelector('[data-demo="open"]')&&$('overlay').hidden&&(!$('gu')||$('gu').hidden)){DM.on=true;go(0)}});

/* title screen: add the demo button */
const title5=title;title=function(){title5.apply(this,arguments);if(DM.on)return;
 const row=[...scene.querySelectorAll('.row')].pop();
 const btn=`<button class="btn dmstart" data-demo="open" aria-label="Start the quick demo">⚡ Quick demo</button>`;
 if(row)row.insertAdjacentHTML('beforeend',btn);else scene.insertAdjacentHTML('beforeend',`<div class="row">${btn}</div>`)};
ACT.again=title;
const wantDemo=/(^|[#?&])demo\b/i.test(location.hash+' '+location.search);
title();if(wantDemo){DM.on=true;go(0)}
})();
