<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Penny's Big Goal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap">
<style>
:root{
  /* Layout: one-column game screen: money bar on top, Penny and her speech bubble, then the active scene card */
  --paper:#FFF6DA; --card:#FFFFFF; --ink:#1A1A1A; --soft:#5E5246;
  --gold:#FFC533; --pink:#FF8FB1; --blue:#4AA3DF; --green:#5CB85C; --red:#E8413A; --lemon:#FFF27A; --cream:#FFF6E0; --purple:#9B6AD6;
  --display:'Fredoka','Baloo 2','Trebuchet MS',sans-serif;
  --body:'Nunito','Trebuchet MS','Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper) radial-gradient(#F1DFA6 1.4px,transparent 1.6px) 0 0/16px 16px;color:var(--ink);font:700 16px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
.game{max-width:580px;margin:0 auto;display:grid;gap:12px}
button{font:inherit;color:inherit}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink)}
.btn{font:600 19px var(--display);border:3px solid var(--ink);border-radius:18px;padding:12px 20px;cursor:pointer;background:var(--card);
  box-shadow:0 5px 0 var(--ink);transition:transform .1s,box-shadow .1s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--gold)}.btn.small{font-size:15px;padding:7px 12px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.12;text-wrap:balance}
h2{font-size:26px}h3{font-size:19px}
.eyebrow{font:800 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.note{font-size:14px;color:var(--soft);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
/* top bar */
.hud{display:grid;gap:8px;padding:10px 14px}
.hudrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.title{font:700 22px var(--display);color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.icons{display:flex;gap:6px}
.ibtn{display:flex;align-items:center;gap:5px;font:600 14px var(--display);border:2px solid var(--ink);border-radius:999px;padding:4px 10px;background:var(--cream);cursor:pointer}
.ibtn[aria-pressed="true"]{background:var(--blue);color:#fff}
.goalbar{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center}
.goalbar svg{width:40px;height:40px}
.bar{height:22px;border:3px solid var(--ink);border-radius:999px;background:var(--cream);overflow:hidden}
.fill{height:100%;width:0;background:var(--green);border-right:3px solid var(--ink);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;text-align:center;font:600 13px var(--display)}
.mini div{border:2px solid var(--ink);border-radius:12px;padding:2px 4px}
.mini b{font-variant-numeric:tabular-nums}
/* penny */
.talk{display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px;align-items:center}
.talk svg{width:112px;height:112px;overflow:visible}
.bubble{position:relative;padding:12px 16px;font:600 19px/1.3 var(--display);min-height:64px;display:flex;align-items:center}
.bubble::before{content:"";position:absolute;left:-15px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid var(--ink)}
.bubble::after{content:"";position:absolute;left:-9px;top:50%;margin-top:-7px;border:7px solid transparent;border-right:10px solid var(--card)}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.blink{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:50% 50%}
.hop{animation:hop .7s cubic-bezier(.3,.7,.4,1);transform-box:fill-box;transform-origin:50% 100%}
.dance{animation:dance 1.8s ease-in-out;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes hop{0%{transform:translateY(0) scale(1.08,.9)}40%{transform:translateY(-34px) scale(.95,1.06)}75%{transform:translateY(0) scale(1.08,.9)}100%{transform:none}}
@keyframes dance{0%,100%{transform:none}15%{transform:rotate(-12deg) translateY(-14px)}30%{transform:rotate(12deg)}45%{transform:rotate(-12deg) translateY(-20px)}60%{transform:rotate(12deg)}75%{transform:rotate(-8deg) translateY(-10px)}90%{transform:rotate(6deg)}}
/* scenes */
.scene{padding:18px;display:grid;gap:14px;animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.95);opacity:.4}to{transform:none;opacity:1}}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:12px}
.choice{display:grid;justify-items:center;gap:6px;padding:12px 8px;cursor:pointer;text-align:center;transition:transform .15s}
.choice:hover{transform:translateY(-4px) rotate(-1deg)}
.choice svg{width:80px;height:80px}
.choice small{color:var(--soft);font-weight:800;line-height:1.3}
.price{font:700 17px var(--display);background:var(--lemon);border:2px solid var(--ink);border-radius:999px;padding:0 10px}
.sel{outline:4px solid var(--blue);outline-offset:2px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* coins */
.coin{border-radius:50%;display:inline-grid;place-items:center;font:700 14px var(--display);border:3px solid var(--ink);flex:none;cursor:pointer;padding:0}
.c50{width:36px;height:36px;background:#D9E1E8;font-size:12px}
.c100{width:42px;height:42px;background:var(--gold)}
.c200{width:48px;height:48px;background:var(--gold);box-shadow:inset 0 0 0 4px #E8A800}
.coins{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:50px}
/* jars */
.jars{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.jarbtn{display:grid;justify-items:center;gap:4px;padding:10px 4px;cursor:pointer;border-radius:18px}
.glass{width:66px;height:86px;border:3px solid var(--ink);border-radius:10px 10px 18px 18px;background:#E9F6FF;position:relative;overflow:hidden}
.glass .lid{position:absolute;top:0;left:0;right:0;height:12px;border-bottom:3px solid var(--ink)}
.glass .lvl{position:absolute;left:0;right:0;bottom:0;transition:height .4s cubic-bezier(.2,.8,.2,1)}
.jarbtn b{font:700 21px var(--display);font-variant-numeric:tabular-nums}
.jarbtn small{font:600 15px var(--display)}
/* work scenes */
.shop{position:relative;height:210px;border:3px solid var(--ink);border-radius:18px;overflow:hidden}
.shop.sunny{background:linear-gradient(#BFE6F7 0 62%,#9ED36A 62%)}
.shop.cloudy{background:linear-gradient(#C9D3DC 0 62%,#8DBF5E 62%)}
.shop .cust{position:absolute;bottom:20px;left:50%;width:110px;margin-left:-55px;transition:transform .5s cubic-bezier(.3,.8,.3,1)}
.shop .cust.wait{transform:translateX(-320px)}.shop .cust.out{transform:translateX(320px)}
.order{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:4px 10px;font:600 16px var(--display);white-space:nowrap;display:flex;gap:6px;align-items:center;max-width:94%}
.order svg{width:30px;height:30px}
.signbox{position:absolute;right:8px;top:54px;width:96px}
.float{position:absolute;font:700 22px var(--display);color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:999px;padding:0 10px;animation:up 1s ease-out forwards;pointer-events:none;z-index:3}
@keyframes up{to{transform:translateY(-80px);opacity:0}}
.stepdots{display:flex;gap:6px;flex-wrap:wrap}
.stepdots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.stepdots i.done{background:var(--gold)}
.stars{font:700 24px var(--display);color:#E8A800;letter-spacing:2px}
.big{font:700 30px var(--display);font-variant-numeric:tabular-nums}
.workgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center}
.cup{width:120px;height:150px;justify-self:center}
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tile{width:52px;height:56px;border:3px solid var(--ink);border-radius:12px;background:var(--lemon);font:700 28px var(--display);cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.slots{display:flex;gap:8px;justify-content:center}
.slot{width:52px;height:56px;border:3px dashed var(--ink);border-radius:12px;display:grid;place-items:center;font:700 28px var(--display);background:var(--card)}
.slot.full{border-style:solid;background:#DFF3DF}
.ptiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ptile{display:grid;justify-items:center;gap:2px;padding:6px;border:3px solid var(--ink);border-radius:14px;background:var(--card);cursor:pointer;font:600 14px var(--display)}
.ptile svg{width:54px;height:54px}
.pages{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.pagebtn{padding:6px;border:3px solid var(--ink);border-radius:12px;background:var(--card);cursor:pointer}
.pagebtn svg{width:100%;height:auto;display:block}
.palette{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.swatch{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);cursor:pointer}
.colorpage{width:min(100%,280px);justify-self:center}
.colorpage [data-region]{cursor:pointer}
.dotsvg{width:min(100%,260px);justify-self:center;touch-action:manipulation}
.feedback{border:3px solid var(--ink);border-radius:16px;padding:10px 14px;font:600 17px var(--display);margin:0}
.event{display:grid;grid-template-columns:100px minmax(0,1fr);gap:14px;align-items:center}
.event svg{width:100px;height:100px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{border:3px solid var(--ink);border-radius:14px;padding:8px 10px;background:var(--cream)}
.stat b{display:block;font:700 24px var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--soft);font-weight:800}
.words{display:flex;flex-wrap:wrap;gap:8px}
.words span{font:600 16px var(--display);border:3px solid var(--ink);border-radius:12px;padding:2px 10px}
.vault{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;height:200px;padding-top:10px}
.vbar{display:grid;justify-items:center;gap:6px;align-self:end}
.vbar div{width:60px;border:3px solid var(--ink);border-radius:10px 10px 4px 4px;background:var(--gold);height:0;transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.vbar b{font:700 20px var(--display)}.vbar small{font-weight:800;color:var(--soft);text-align:center;line-height:1.2}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.badge{display:grid;justify-items:center;gap:4px;text-align:center;padding:10px 6px;border:3px solid var(--ink);border-radius:16px;background:var(--cream)}
.badge svg{width:56px;height:56px}
.badge.locked{filter:grayscale(1);opacity:.45}
.badge b{font:600 15px var(--display);line-height:1.15}
.badge small{font-size:12px;color:var(--soft);line-height:1.25}
.overlay{position:fixed;inset:0;background:rgba(26,26,26,.55);display:grid;place-items:center;padding:16px;z-index:15}
.overlay .card{max-width:520px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:18px;display:grid;gap:14px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;background:var(--cream)}
.seg{display:flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{border:0;padding:6px 12px;font:600 15px var(--display);background:var(--card);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);background:var(--ink);color:#fff;font:600 16px var(--display);padding:10px 16px;border-radius:14px;opacity:0;transition:opacity .25s,transform .25s;z-index:25;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border:2px solid var(--ink);animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.sparkle{animation:sparkle 1s ease-in-out infinite}
@keyframes sparkle{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,197,51,.9)}50%{transform:scale(1.15);box-shadow:0 0 0 10px rgba(255,197,51,0)}}
@media (max-width:420px){.talk{grid-template-columns:86px minmax(0,1fr)}.talk svg{width:86px;height:86px}.bubble{font-size:17px}.choice svg{width:66px;height:66px}.tile,.slot{width:44px;height:50px;font-size:24px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="game">
 <div class="card hud">
  <div class="hudrow"><span class="title">Penny's Big Goal</span>
   <div class="icons">
    <button class="ibtn" id="voice" aria-pressed="false" aria-label="Read aloud"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9 L8 9 L13 5 L13 19 L8 15 L4 15Z" fill="currentColor"/><path d="M16 8 Q19 12 16 16 M18 5 Q23 12 18 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="voiceLbl">Read aloud</span></button>
    <button class="ibtn" id="badgeBtn" aria-label="Badge book"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L15 8 L22 9 L17 14 L18 21 L12 18 L6 21 L7 14 L2 9 L9 8Z" fill="currentColor"/></svg><span id="starCount">0</span></button>
    <button class="ibtn" id="setBtn" aria-label="Settings"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></button>
   </div></div>
  <div class="goalbar" id="goalbar" hidden><svg viewBox="0 0 100 100" id="goalIcon" aria-hidden="true"></svg>
   <div class="bar" role="progressbar" aria-label="Savings toward goal" aria-valuemin="0" aria-valuemax="100" id="gbar"><div class="fill" id="gfill"></div></div><span id="gtext" style="font:600 16px var(--display)"></span></div>
  <div class="mini" id="mini" hidden></div>
 </div>
 <div class="talk"><svg viewBox="0 0 300 300" id="penny" role="img" aria-label="Penny the Piggy Bank"></svg>
  <div class="card bubble" id="bubble" aria-live="polite"></div></div>
 <main class="card scene" id="scene"></main>
</div>
<div id="overlay" class="overlay" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
/* =========================================================
   PENNY'S BIG GOAL · Kid AI Earners · Young Stars Starlette Program
   Phase 1 update: Level 1 (ages 5–6). Money is tracked in cents.
   ========================================================= */
const C={gold:'#FFC533',pink:'#FF8FB1',blue:'#4AA3DF',green:'#5CB85C',red:'#E8413A',ink:'#1A1A1A',lemon:'#FFF27A',white:'#FFFFFF',cream:'#FFF6E0',grey:'#C9D3DC',purple:'#9B6AD6',orange:'#FF9F40',brown:'#A0673A',sky:'#BFE6F7',navy:'#2B2D6E',sand:'#F6DE9C',sea:'#5EC3E8'};
const st=`stroke="${C.ink}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"`;
const T=(x,y,s,sz=14,f=C.ink)=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="Fredoka,Trebuchet MS,sans-serif" font-weight="700" font-size="${sz}" fill="${f}">${s}</text>`;
const coinS=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${C.gold}" ${st}/>${T(x,y+r*.38,'$',r*1.05)}`;
const smile=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><circle cx="-6" cy="0" r="3" fill="${C.ink}"/><circle cx="6" cy="0" r="3" fill="${C.ink}"/><path d="M-6 7 Q0 12 6 7" fill="none" stroke="${C.ink}" stroke-width="2.5" stroke-linecap="round"/></g>`;
const $=id=>document.getElementById(id);
const money=c=>c<100&&c>0?c+'¢':'$'+(c%100?(c/100).toFixed(2):c/100);
const coinLbl=c=>c===50?'50¢':'$'+c/100;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- settings + badges (saved on this device) ---------- */
let SET=Object.assign({give:true,word:'Tithe',voice:false},LS.get('pbg_settings',{}));
let BADGES=new Set(LS.get('pbg_badges',[]));
const saveSet=()=>LS.set('pbg_settings',SET);

/* ---------- art ---------- */
const ART={
 bike:`<circle cx="26" cy="66" r="18" fill="${C.white}" ${st} stroke-width="5"/><circle cx="74" cy="66" r="18" fill="${C.white}" ${st} stroke-width="5"/><path d="M26 66 L44 40 L68 40 L74 66 M44 40 L52 66 L68 40 M26 66 L52 66" fill="none" stroke="${C.red}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M36 34 L50 34" stroke="${C.ink}" stroke-width="6" stroke-linecap="round"/><path d="M68 40 L70 28 L80 26" fill="none" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/>`,
 art:`<path d="M50 14 C80 14 92 34 88 52 C84 68 70 62 62 70 C56 78 66 90 50 88 C24 86 10 70 12 48 C14 28 30 14 50 14Z" fill="${C.cream}" ${st}/>${[[34,34,C.red],[54,28,C.blue],[72,40,C.green],[28,56,C.gold]].map(([x,y,f])=>`<circle cx="${x}" cy="${y}" r="7" fill="${f}" stroke="${C.ink}" stroke-width="2.5"/>`).join('')}<rect x="58" y="56" width="10" height="38" rx="4" fill="${C.purple}" ${st} transform="rotate(-30 63 75)"/>`,
 ball:`<circle cx="50" cy="52" r="36" fill="${C.white}" ${st}/><path d="M50 36 L64 46 L59 62 L41 62 L36 46Z" fill="${C.ink}"/><path d="M50 36 L50 16 M64 46 L84 40 M59 62 L72 80 M41 62 L28 80 M36 46 L16 40" stroke="${C.ink}" stroke-width="3"/>`,
 vault:`<rect x="14" y="16" width="72" height="72" rx="10" fill="${C.grey}" ${st}/><rect x="22" y="24" width="56" height="56" rx="6" fill="${C.blue}" ${st}/><circle cx="50" cy="52" r="15" fill="${C.gold}" ${st}/><path d="M50 37 L50 67 M35 52 L65 52" stroke="${C.ink}" stroke-width="3"/><rect x="26" y="88" width="12" height="6" fill="${C.ink}"/><rect x="62" y="88" width="12" height="6" fill="${C.ink}"/>`,
 lemonade:`<path d="M28 30 L72 30 L65 90 L35 90 Z" fill="${C.lemon}" ${st}/><path d="M31 46 L69 46" ${st}/><path d="M58 30 L66 8 L74 10" fill="none" ${st}/><circle cx="72" cy="34" r="12" fill="${C.gold}" ${st}/>${smile(50,66)}`,
 coloring:`<rect x="18" y="20" width="48" height="62" rx="4" fill="${C.white}" ${st} transform="rotate(-8 42 51)"/><rect x="32" y="16" width="48" height="62" rx="4" fill="${C.white}" ${st}/><circle cx="56" cy="38" r="10" fill="${C.gold}" ${st}/><path d="M40 66 Q56 52 72 66" fill="none" ${st}/><rect x="58" y="62" width="10" height="34" rx="3" fill="${C.red}" ${st} transform="rotate(35 63 79)"/>`,

   <div class="row"><button class="btn" data-check="yes" style="background:#DFF3DF">Yes</button><button class="btn" data-check="no" style="background:#FFE3EC">No</button></div>${progressHTML()}`);return}
 const options=S.job==='lemonade'?[50,100,100,200]:[100,200,200];const given=pick(options);
 if(given===price){pay={type:'exact'};say(`They paid exactly ${money(price)}. Thank you!`);finishCustomer(price,false);return}
 pay={type:'change',price,given,change:given-price,built:[]};say(`They gave you ${money(given)} for a ${money(price)} ${JOBS[S.job].unit}. Give them their change!`);renderChange()}
function renderChange(){const sum=pay.built.reduce((a,b)=>a+b,0);
 show(`<span class="eyebrow">Get paid · Make change</span>
  <div class="feedback" style="background:${C.cream}">Price ${money(pay.price)} · They paid ${money(pay.given)}</div>
  <h3>Change to give: <span id="chg">${money(sum)}</span></h3><div class="coins">${pay.built.map(c=>`<span class="coin c${c}">${coinLbl(c)}</span>`).join('')||'<span class="note">Tap coins below</span>'}</div>
  <h3>Coin tray</h3><div class="coins">${[50,100].map(c=>`<button class="coin c${c}" data-tray="${c}" aria-label="Add ${coinLbl(c)}">${coinLbl(c)}</button>`).join('')}</div>
  <div class="row"><button class="btn small" data-act="clearChange">Clear</button><button class="btn go" data-act="giveChange" ${sum?'':'disabled'}>Give change</button></div>${progressHTML()}`)}
function giveChange(){const sum=pay.built.reduce((a,b)=>a+b,0);pay.tries=(pay.tries||0)+1;
 if(sum===pay.change){const bonus=pay.tries===1;if(bonus){star();award('change')}
  say(bonus?'Perfect change! You earned a bonus star!':'That\'s right! Good counting.',true);finishCustomer(pay.price,true);return}
 say(sum>pay.change?'That\'s too much change. Try again!':'Not enough change yet. Try again!');pay.built=[];renderChange()}
function checkPay(ans){const right=(ans==='yes')===pay.ok;
 if(right){star();say(pay.ok?'Yes! That\'s exactly right. Great counting!':`Good catch! That's only ${money(pay.coins.reduce((a,b)=>a+b,0))}. They add the rest.`,true)}
 else say(pay.ok?`Let's count again: it is ${money(pay.price)}. You got paid!`:`Count again: that's ${money(pay.coins.reduce((a,b)=>a+b,0))}, not ${money(pay.price)}. They add the rest.`);
 finishCustomer(pay.price,true)}
function finishCustomer(price,delay){S.today+=price;S.served++;S.earned+=price;
 later(()=>{const c=$('cust');if(c)c.className='cust out';setTimeout(serveNext,delay?900:500)},delay?900:400)}

/* ---- PAYDAY ---- */
let coins,selC,put;
function makeCoins(total){const out=[];let r=total;const first=total>=1000?100:50;out.push(first);r-=first;
 while(r>0){let c;if(r>=200&&Math.random()<.45)c=200;else if(r>=100&&Math.random()<.75)c=100;else c=r>=100?(r%100?50:100):50;out.push(c);r-=c}
 return out}
function dayDone(){const total=S.today+S.tips;S.today=total;S.earned+=S.tips;coins=makeCoins(total);
 say(`Great work today! Let's count your money. How much did you earn?`,true);
 const opts=shuffle([total,total+50,Math.max(50,total-50)].filter((v,i,a)=>a.indexOf(v)===i));
 show(`<span class="eyebrow">Payday · Count it up</span><h2>How much money is this?</h2><div class="coins">${coins.map(c=>`<span class="coin c${c}">${coinLbl(c)}</span>`).join('')}</div>
  <div class="row">${opts.map(v=>`<button class="btn" data-count="${v}">${money(v)}</button>`).join('')}</div>
  <p class="note" style="text-align:center">Tips included: ${money(S.tips)}</p>`)}
function countAns(v){if(+v===S.today){star();say(`Yes! You earned ${money(S.today)} today. Work earns money!`,true);later(SET.give?firstCoin:sortStart,1300)}
 else{say('Not quite. Count each coin again: 50¢, $1, and $2.');const b=document.querySelector(`[data-count="${v}"]`);b.classList.add('shake');b.disabled=true}}
function firstCoin(){const g=coins[0];say(`Before anything else, your first coin goes to your ${giveWord()} jar. Tap the shiny coin!`);
 show(`<span class="eyebrow">Payday · First coin ceremony</span><h2>Give first</h2><p style="margin:0">Your first ${coinLbl(g)} goes to ${giveWord()==='Tithe'?'your tithe':'giving'}. That's about one tenth of today's money.</p>
  <div class="coins"><button class="coin c${g} sparkle" data-act="giveCoin" aria-label="Give the first coin">${coinLbl(g)}</button>${coins.slice(1).map(c=>`<span class="coin c${c}" style="opacity:.5">${coinLbl(c)}</span>`).join('')}</div>`)}
function giveCoin(){lock=true;const g=coins.shift();S.jars.give+=g;hud();award('firstgive');confetti(25);
 say(`Wonderful! Giving first shows what matters most to you.`,true);later(sortStart,1500)}
function sortStart(){selC=0;put={save:[],spend:[],share:[]};say('Now tap a coin, then tap a jar. Which coins will you save?');renderSort()}
function renderSort(){const left=coins.length,tot=Math.max(1,[...put.save,...put.spend,...put.share,...coins].reduce((a,b)=>a+b,0));
 const sumOf=k=>put[k].reduce((a,b)=>a+b,0);
 show(`<span class="eyebrow">Payday · Save, Spend, Share</span><h2>${left?'Sort your coins':'Every coin has a job!'}</h2>
  <div class="coins">${left?coins.map((c,i)=>`<button class="coin c${c} ${i===selC?'sel':''}" data-coin="${i}" aria-label="Pick ${coinLbl(c)}">${coinLbl(c)}</button>`).join(''):'<span class="note">All sorted.</span>'}</div>
  ${left?`<p class="note" style="text-align:center">Picked: <b>${coinLbl(coins[selC])}</b>. Now tap a jar.</p>`:''}
  <div class="jars">${[['save','Save',C.gold,'For your goal'],['spend','Spend',C.blue,'For fun and needs'],['share','Share',C.pink,'To help others']].map(([k,n,col,d])=>`
   <button class="card jarbtn" data-jar="${k}" aria-label="${n} jar"><div class="glass"><div class="lid" style="background:${col}"></div><div class="lvl" style="background:${col};height:${sumOf(k)/tot*85}%"></div></div>
   <small>${n}</small><b>${money(sumOf(k))}</b><span class="note">${d}</span></button>`).join('')}</div>
  <div class="row">${left?'<button class="btn small" data-act="tip">Use Penny\'s tip</button>':''}<button class="btn small" data-act="sortReset">Start over</button>${left?'':'<button class="btn go" data-act="sorted">Done</button>'}</div>`)}
function dropCoin(k){if(!coins.length)return;put[k].push(coins.splice(selC,1)[0]);selC=0;renderSort();if(!coins.length)sortedMsg()}
function sortedMsg(){const s=put.save.reduce((a,b)=>a+b,0),t=[...put.save,...put.spend,...put.share].reduce((a,b)=>a+b,0);
 if(s*2>=t){award('saver');say('Wow, you saved at least half. Your goal is getting closer!',true)}else say(s?'Nice sorting! Every saved coin helps.':'No coins saved today. Saving gets you to your goal!')}
function penTip(){const all=[...coins,...put.save,...put.spend,...put.share].sort((a,b)=>b-a);put={save:[],spend:[],share:[]};const t=all.reduce((a,b)=>a+b,0);let s=0;
 all.forEach(c=>{if(s<t/2){put.save.push(c);s+=c}else if(put.spend.reduce((a,b)=>a+b,0)<t*.3)put.spend.push(c);else put.share.push(c)});
 if(!put.share.length&&put.spend.length>1)put.share.push(put.spend.pop());coins=[];renderSort();say('Penny\'s tip: half to Save, some to Spend, and a little to Share.',true);award('saver')}
function sorted(){['save','spend','share'].forEach(k=>S.jars[k]+=put[k].reduce((a,b)=>a+b,0));hud();surprise()}

/* ---- AFTER WORK: surprise event ---- */
function surprise(){S.eventsSeen++;if(S.day===2||(S.day>3&&S.day%3===2))return stickerShop();
 const ev=S.ev[S.evIdx++%S.ev.length];S.cur=ev;S.classified=false;say('Surprise! Is this a need or a want?');
 show(`<span class="eyebrow">After work · Surprise</span><div class="event">${svgA(ev.id)}<div><h2>${ev.name}</h2><p style="margin:6px 0 0">${ev.text}</p><span class="price">${money(ev.price)}</span></div></div>
  <div id="evArea"><h3 style="margin-bottom:10px">Is it a need or a want?</h3><div class="row"><button class="btn" data-cls="need" style="background:#DFF3DF">Need</button><button class="btn" data-cls="want" style="background:#FFE3EC">Want</button></div></div>`)}
function classify(c){const ev=S.cur;const right=(c==='need')===ev.need;S.classified=true;if(right){star();award('need')}
 say(ev.need?(right?'Yes! That\'s a need. Needs keep us safe and healthy.':'This one is a need. You need it to stay safe and healthy.'):(right?'Yes! That\'s a want. Fun to have, but you can live without it.':'This one is a want. It\'s fun, but you can live without it.'),right);
 const canSpend=S.jars.spend>=ev.price,canAll=S.jars.spend+S.jars.save>=ev.price;
 $('evArea').innerHTML=`<p class="feedback" style="background:${right?'#DFF3DF':C.lemon}">${right?'Correct! ':''}It's a <b>${ev.need?'need':'want'}</b>.</p>
  <h3 style="margin:12px 0 10px">${ev.need?'Take care of it?':'Buy it or wait?'} You have ${money(S.jars.spend)} in Spend.</h3>
  ${!canSpend&&!ev.need?'<p class="note" style="margin:0 0 10px">Your Spend jar doesn\'t have enough for this want. Waiting is the smart move.</p>':''}
  <div class="row">${canSpend?`<button class="btn go" data-buy="spend">Buy with Spend</button>`:(ev.need&&canAll?`<button class="btn go" data-buy="save">Use Spend + Save</button>`:'')}<button class="btn" data-buy="skip">${ev.need?'Skip it':'Wait and save'}</button></div>`}
function pay_(cost){const fromSpend=Math.min(S.jars.spend,cost);S.jars.spend-=fromSpend;S.jars.save-=cost-fromSpend;hud()}
function buyEv(how){const ev=S.cur;let line;
 if(how==='skip')line=ev.need?'Okay. Remember, needs come first. Next time let\'s take care of them.':'Great waiting! Skipping a want keeps money for your goal.';
 else{pay_(ev.price);line=ev.need?(how==='save'?'You used some savings for a need. That\'s what savings are for in emergencies.':'Smart! You took care of a need with your Spend money.'):'Enjoy it! Spending on wants is okay when you use your Spend jar.'}
 say(line,how!=='skip'||!ev.need);later(afterEvent,1700)}
function onTrack(){return S.jars.save>=Math.min(500,S.goal.price*.4)}
const SHEETS=[{id:'mini',name:'Mini stars',price:50},{id:'shiny',name:'Shiny hearts',price:100},{id:'mega',name:'Mega pack',price:200}];
function stickerShop(){const target=pick(SHEETS);S.ptm={target,done:false};
 say(`Your friend Amara started a sticker business! First, help her: which sheet costs ${money(target.price)}?`);
 show(`<span class="eyebrow">After work · Friend's sticker shop</span><div class="event"><div>${person(11)}</div><div><h2>Amara's Sticker Shop</h2><p style="margin:6px 0 0">Your friend made her own sticker business.</p></div></div>
  <h3>Price Tag Match: tap the sheet that costs ${money(target.price)}</h3>
  <div class="choices">${shuffle(SHEETS).map(s=>`<button class="card choice" data-sheet="${s.id}">${svgA('stickersheet')}<b>${s.name}</b><span class="price">${money(s.price)}</span></button>`).join('')}</div><div id="shopArea"></div>`)}
function tapSheet(id){const s=SHEETS.find(x=>x.id===id);
 if(!S.ptm.done){if(s.id===S.ptm.target.id){S.ptm.done=true;star();
   const track=onTrack();
   say(track?'You found it! You\'ve saved well, so supporting your friend\'s business is a great use of Spend money!':'You found it! Your savings are still growing, so you might save first and visit next time. It\'s your choice.',true);
   $('shopArea').innerHTML=`<p class="feedback" style="background:${track?'#DFF3DF':C.lemon}">${track?'Your savings are on track. Buying from a friend helps her business grow!':'Tip: save first, then support friends when your goal is on track.'}</p>
    <h3 style="margin:12px 0 8px">Buy a sheet with Spend money? You have ${money(S.jars.spend)}.</h3>
    <div class="row">${SHEETS.map(x=>`<button class="btn small" data-bsheet="${x.id}" ${S.jars.spend>=x.price?'':'disabled'}>Buy ${x.name} · ${money(x.price)}</button>`).join('')}<button class="btn small" data-bsheet="none">Maybe next time</button></div>`}
  else{const b=document.querySelector(`[data-sheet="${id}"]`);b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);say('Look at the price tags again.')}}}
function buySheet(id){if(id==='none'){say('Okay! Amara will be happy to see you next time.');later(afterEvent,1400);return}
 const s=SHEETS.find(x=>x.id===id);pay_(s.price);award('kind');say(`Amara says thank you! You helped her business grow. That's being a kind friend.`,true);later(afterEvent,1700)}
function afterEvent(){if(!S.umbrella&&S.jars.spend>=300)return upgrade();giveCheck()}
function upgrade(){say('Want to grow your business? A sun umbrella keeps customers cool and brings 1 extra customer on sunny days!');
 show(`<span class="eyebrow">After work · Shop upgrade</span><div class="event">${svgA('umbrella')}<div><h2>Sun umbrella</h2><p style="margin:6px 0 0">Brings 1 extra customer every sunny day.</p><span class="price">$3</span></div></div>
  <p class="note">Spending money to help your business earn more is called reinvesting.</p>
  <div class="row"><button class="btn go" data-act="buyUmbrella">Buy with Spend</button><button class="btn" data-act="skipUmbrella">Not now</button></div>`)}

/* ---- Where will you give? ---- */
const CAUSES={church:{name:'Church',impact:'You helped your church care for families in need!'},food:{name:'Food bank',impact:'You helped pack 4 lunches for kids!'},shelter:{name:'Animal shelter',impact:'You helped feed 3 puppies!'}};
function giveCheck(){if(SET.give&&S.jars.give>=200)return whereGive('give');if(S.jars.share>=200)return whereGive('share');tree()}
function whereGive(jar){const amt=S.jars[jar];const tithe=jar==='give'&&giveWord()==='Tithe';
 say(tithe?`Your ${giveWord()} jar has ${money(amt)}! Let's bring your tithe to church.`:`Your ${jar==='give'?'Give':'Share'} jar has ${money(amt)}! Where will you give?`);
 const causes=tithe?['church']:['church','food','shelter'];
 show(`<span class="eyebrow">Giving · ${jar==='give'?giveWord():'Share'} jar</span><h2>${tithe?'Bring your tithe':'Where will you give?'}</h2><p style="margin:0">${money(amt)} ready to give.</p>
  <div class="choices">${causes.map(c=>`<button class="card choice" data-cause="${jar}:${c}">${svgA(c==='food'?'foodbank':c)}<h3>${CAUSES[c].name}</h3></button>`).join('')}</div>`)}
function doGive(jar,cause){const amt=S.jars[jar];S.jars[jar]=0;if(jar==='give')S.given+=amt;else S.shared+=amt;hud();award('giver');confetti(30);
 say(CAUSES[cause].impact+' Giving makes a real difference.',true);
 show(`<span class="eyebrow">Giving</span><div class="event">${svgA(cause==='food'?'foodbank':cause)}<div><h2>Thank you!</h2><p style="margin:6px 0 0">${CAUSES[cause].impact}</p></div></div><button class="btn go" data-act="giveNext">Continue</button>`)}

/* ---- Water the money tree ---- */
let water;
function tree(){water=0;const grow=S.jars.save>=500;
 say(grow?'Your savings are big enough to grow! Water your money tree 3 times.':'Your money tree grows coins when you have $5 or more in Save. Keep saving!');
 show(`<span class="eyebrow">Grow · Money tree</span><div style="display:grid;place-items:center"><svg viewBox="0 0 100 100" style="width:180px" id="treeSvg" aria-hidden="true">${ART.tree}<g id="treeCoin" style="opacity:0">${coinS(50,30,10)}</g></svg></div>
  ${grow?`<button class="btn go" data-act="water" style="justify-self:center">${svgA('can','width="34" height="34" style="vertical-align:middle"')} Water the tree</button><p class="note" style="text-align:center" id="waterMsg">0 of 3</p>`:
  `<p class="note" style="text-align:center">You have ${money(S.jars.save)} in Save.</p><button class="btn go" data-act="summary">See my day</button>`}`)}
function doWater(){water++;$('waterMsg').textContent=water+' of 3';$('treeSvg').style.transform=`scale(${1+water*.05})`;
 if(water>=3){S.jars.save+=100;S.grown+=100;S.todayGrow=100;hud();$('treeCoin').style.opacity=1;award('tree');
  say('Look! Your tree grew a $1 coin because you left your savings alone. That\'s Grow!',true);
  scene.querySelector('[data-act="water"]').outerHTML='<button class="btn go" data-act="summary">See my day</button>'}}

/* ---- Summary + win ---- */
function summary(){const done=S.jars.save>=S.goal.price;
 say(done?'You reached your goal! Let\'s celebrate!':`Day ${S.day} is done. Great job!`,done);
 show(`<span class="eyebrow">End of day ${S.day}</span><h2>${done?'You did it!':'Day '+S.day+' complete'}</h2>
  <div class="stats"><div class="stat"><b>${money(S.jars.save)}</b><span>Saved toward ${S.goal.name.toLowerCase()}</span></div><div class="stat"><b>${money(Math.max(0,S.goal.price-S.jars.save))}</b><span>Still to go</span></div>
   <div class="stat"><b>${money(S.today)}</b><span>Earned today</span></div><div class="stat"><b>${S.stars}</b><span>Stars earned</span></div></div>
  ${done?'<button class="btn go" data-act="win">See my prize</button>':`<button class="btn go" data-act="nextDay">Start day ${S.day+1}</button>`}`)}
const WORDS=[['Earn',C.gold],['Give',C.green],['Save',C.pink],['Spend',C.sky],['Share',C.pink],['Goal',C.lemon],['Need',C.green],['Want',C.sky],['Grow',C.gold]];
function win(){confetti();award('goal');dance();const g=S.goal;
 const stats=`<div class="stats"><div class="stat"><b>${S.day}</b><span>Days of work</span></div><div class="stat"><b>${money(S.earned)}</b><span>Money earned</span></div>
  <div class="stat"><b>${money(S.given+S.shared+S.jars.give+S.jars.share)}</b><span>Given and shared</span></div><div class="stat"><b>${money(S.grown)}</b><span>Grown on your money tree</span></div></div>
  <div class="words">${WORDS.map(([w,c])=>`<span style="background:${c}">${w==='Give'?giveWord():w}</span>`).join('')}</div>
  <div class="row"><button class="btn" data-act="badges">See my badges</button><button class="btn go" data-act="again">Play again</button></div>`;
 if(g.future){say(`Your Future Vault has ${money(S.jars.save)}! Now watch what time can do.`);
  show(`<span class="eyebrow">Goal reached</span><h2>Your Future Vault is full!</h2>
   <div class="vault"><div class="vbar"><b>${money(S.jars.save)}</b><div id="v0"></div><small>Today</small></div><div class="vbar"><b id="v1t">?</b><div id="v1"></div><small>In 10 years</small></div><div class="vbar"><b id="v2t">?</b><div id="v2"></div><small>In 17 years</small></div></div>
   <button class="btn go" data-act="vgrow">Leave it alone and watch it grow</button>
   <p class="note">Pretend example growing 6% a year. Real money can grow faster or slower, and sometimes goes down for a while.</p>${stats}`);
  requestAnimationFrame(()=>{$('v0').style.height='40px'})}
 else{say('You reached your goal! You worked, gave, saved, and waited. I\'m so proud of you!');
  show(`<span class="eyebrow">Goal reached</span><h2>You bought ${g.name.toLowerCase()}!</h2><div style="display:grid;place-items:center">${svgA(g.id,'width="140" height="140"')}</div>
   ${S.jars.spend?`<p class="feedback" style="background:#DDEFFB">You still have ${money(S.jars.spend)} in your Spend jar for something fun.</p>`:''}${stats}`)}}
function vgrow(){const a=S.jars.save,b=a*Math.pow(1.06,10),c=a*Math.pow(1.06,17);
 $('v1').style.height=(b/c*150)+'px';$('v2').style.height='150px';$('v0').style.height=(a/c*150)+'px';
 setTimeout(()=>{$('v1t').textContent=money(Math.round(b/50)*50);$('v2t').textContent=money(Math.round(c/50)*50)},900);
 say('Money left alone for a long time can grow and grow. That\'s the power of Grow!',true)}

/* ================= INPUT ================= */
const ACT={goals,settings,badges:badgeBook,signStart,signDone,jobs,squeeze:doSqueeze,taste,recipeReset:()=>{mix={lemon:0,sugar:0,water:0};renderRecipe()},
 makePage,usePages:()=>{say('Great, let\'s sell your pages!');serveNext()},newPages:dotsStart,colorDone,clearChange:()=>{pay.built=[];renderChange()},giveChange,
 giveCoin,tip:penTip,sortReset:()=>{coins=[...coins,...put.save,...put.spend,...put.share];sortStart()},sorted,
 buyUmbrella:()=>{S.jars.spend-=300;S.umbrella=true;hud();award('umbrella');say('Smart investing! More customers will come on sunny days.',true);later(giveCheck,1500)},
 skipUmbrella:()=>{say('Okay! You can buy it another day.');later(giveCheck,1000)},giveNext:giveCheck,water:doWater,summary,
 nextDay:()=>{S.day++;S.todayGrow=0;dayStart()},win,vgrow,again:title};
scene.addEventListener('click',e=>{if(lock)return;const t=e.target.closest('button,[data-dot],[data-region]');if(!t||t.disabled)return;const d=t.dataset;
 if(d.act&&ACT[d.act])return ACT[d.act]();
 if(d.goal){S.goal=GOALS.find(g=>g.id===d.goal);hud();say(S.goal.line,true);later(dayStart,1500);return}
 if(d.sign){const [k,v]=d.sign.split(':');signDraft[k]=+v;renderSign();return}
 if(d.job)return startJob(d.job);
 if(d.mix){mix[d.mix]++;renderRecipe();return}
 if(d.dot)return tapDot(+d.dot);
 if(d.pr){const [k,v]=d.pr.split(':');draft[k]=v;renderPrompt();return}
 if(d.col){cur=d.col;renderColor();return}
 if(d.region){paint[d.region]=cur;renderColor();return}
 if(d.page)return pickPage(+d.page);
 if(d.tile)return tapTile(+d.tile);
 if(d.ncol){nm.color=d.ncol;renderName();return}
 if(d.stk){nm.stk=d.stk;renderName();return}
 if(d.act==='toKind')return;
 if(d.kind)return chooseKind(d.kind);
 if(d.tray){pay.built.push(+d.tray);renderChange();return}
 if(d.check)return checkPay(d.check);
 if(d.count)return countAns(d.count);
 if(d.coin){selC=+d.coin;renderSort();return}
 if(d.jar)return dropCoin(d.jar);
 if(d.cls){if(!S.classified)classify(d.cls);return}
 if(d.buy)return buyEv(d.buy);
 if(d.sheet)return tapSheet(d.sheet);
 if(d.bsheet)return buySheet(d.bsheet);
 if(d.cause){const [j,c]=d.cause.split(':');return doGive(j,c)}});
ACT.toKind=()=>{nm.stage='kind';say('Pick kind words for the card.');renderName()};
syncVoice();title();
window.PBG={get S(){return S}};
</script>
<script>/* PHASE2 */
/* =========================================================
   PHASE 2 · Levels 2–4 (ages 7–13)
   Adds on top of Level 1: level select, new jobs, costs and profit,
   pricing, bills, exact 10%, percent splits, bank + interest,
   AI skills, clients, tools, weekly reports, Dress Up Penny.
   ========================================================= */
document.head.insertAdjacentHTML('beforeend',`<style>

.c1000{background:#7FC4E8}.c2000{background:#F5A3C0}

let qty=4;

function restock(){const j=J2[S.job],have=S.invs[S.job];
 if(have===0&&S.biz<j.cost){S.biz+=600;hud();toast('Your grown-up added $6 to your business jar so you can restock.')}
 const cost=qty*j.cost;
 say(have?`You have ${have} ${j.unit}s left from before. How many more will you make?`:`Restock run! How many ${j.unit}s will you make? Each costs ${money(j.cost)} to print.`);

  <button class="btn go" data-x="buy:1" ${cost<=S.biz&&have+qty>0?'':'disabled'}>${qty?`Buy supplies for ${money(cost)}`:'Use what I have'}</button>`)}

<script>/* PHASE3 */
/* =========================================================

/* ---------- compile dictionaries ---------- */
const I18D={};
function compile(lang){if(I18D[lang]||!I18N[lang])return I18D[lang];const exact=I18N[lang],tpl=[];
 for(const k in exact)if(/\{\d+\}/.test(k)){const lit=k.replace(/\{\d+\}/g,'').replace(/[\s·:.,!?%$-]/g,'').length;if(lit<3)continue;
  const re=new RegExp('^'+k.replace(/[.*+?^$()|[\]\\]/g,'\\$&').replace(/\{(\d+)\}/g,'(.*?)')+'$');tpl.push({k,re,lit,order:[...k.matchAll(/\{(\d+)\}/g)].map(m=>+m[1])})}

const norm=s=>s.replace(/\s+/g,' ').trim();
function trCore(core,d){if(d.exact[core]!=null&&d.exact[core]!=='')return d.exact[core];

   t.order.forEach((n,i)=>{out=out.split('{'+n+'}').join(trCap(m[i+1],d))});return out}}
 return null}
function trCap(x,d){if(x==='s'||x==='es')return '';if(d.exact[x])return d.exact[x];const up=x.charAt(0).toUpperCase()+x.slice(1);if(d.exact[up]){const v=d.exact[up];return v.charAt(0).toLowerCase()+v.slice(1)}return x}
function trAny(core,d){let out=trCore(core,d);if(out!=null)return out;
 if(/^[a-z]/.test(core)){const up=trCore(core.charAt(0).toUpperCase()+core.slice(1),d);if(up!=null)return /^(de)$/.test(SET.lang)?up:up.charAt(0).toLowerCase()+up.slice(1)}
 const star=core.match(/^([★☆]+)\s*(.+)$/);if(star){const r=trAny(star[2],d);return r==null?null:star[1]+' '+r}
 if(core.includes(' · ')){let hit=false;const t=core.split(' · ').map(p=>{const r=trPiece(p,d);if(r!==p)hit=true;return r});if(hit)return t.join(' · ')}
 {const r=trPiece(core,d);if(r!==core)return r}
 const parts=core.split(/(?<=[.!?])\s+/);if(parts.length>1){let hit=false;const sep=/^(zh)$/.test(SET.lang)?'':' ';
  const t=parts.map(p=>{const r=trCore(p,d);if(r!=null){hit=true;return r}return p});return hit?t.join(sep):null}
 return null}
function trPiece(p,d){let r=trCore(p,d);if(r!=null)return r;
 const m=p.match(/^([\s♪"“”'(→:-]*)(.*?)([\s♪"“”')→:-]*)$/);if(!m||!m[2]||m[2]==='___')return p;

 return r==null?p:m[1]+r+m[3]}

 return m.find(v=>v.lang.replace('_','-')===code)||m.find(v=>/female|samantha|google|natural|zira|aria|jenny/i.test(v.name))||m[0]||null}

 speakRaw(tr(t))};

icons.insertAdjacentHTML('afterbegin',`<button class="ibtn" id="langBtn" aria-label="Language"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="currentColor" stroke-width="2"/></svg><span id="langLbl" data-notr>EN</span></button>

  <div class="choices" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))" data-notr>${LANGS.map(([c,n])=>`<button class="card choice ${SET.lang===c?'sel':''}" data-lang="${c}" style="height:auto;min-height:92px;overflow:visible;align-content:center"><b style="font:600 19px var(--display)">${n}</b><small>${voiceFor(c)?'Voice on this device':'Text only on this device'}</small></button>`).join('')}</div>
  <p class="note">Translations are new. Native speakers will review them, especially Yorùbá and Igbo. Prices stay in US dollars.</p>`)}
$('langBtn').addEventListener('click',langPicker);$('langBtn').hidden=true;

  while(n=w.nextNode()){const p=n.parentNode;if(p.closest('svg,script,style,[data-notr]'))continue;const base=orig.has(n)?orig.get(n):n.nodeValue;if(!orig.has(n))orig.set(n,base);const t=tr(base);shown.set(n,t);if(n.nodeValue!==t)n.nodeValue=t}})}

{const el=[...document.querySelectorAll('.game > p.note[data-notr]')].find(p=>/Version 3/.test(p.textContent));if(el)el.textContent=`Penny's Big Goal · ${APP_VERSION4}`}

function totals(st){const r=Object.values(st.runs);const s={earned:0,given:0,shared:0,saved:0,spend:0,grown:0,stars:0};r.forEach(x=>{for(const k in s)s[k]+=x[k]||0});return s}
function skillState(st,id){if(id==='save'){const t=totals(st);const n=st.goals.length;if(!Object.keys(st.runs).length)return{lvl:0,pct:null,n:0};
  const rate=t.earned?t.saved/t.earned:0;const pct=Math.round(rate*100);return{lvl:n>=2&&rate>=.35?3:n>=1?2:1,pct,n,goals:n}}
 const s=st.sk[id];if(!s||!s.r.length)return{lvl:0,pct:null,n:0};const pct=Math.round(s.r.reduce((a,b)=>a+b,0)/s.r.length*100);const n=s.ok+s.miss;
 return{lvl:n<3?1:pct>=85&&n>=5?3:pct>=60?2:1,pct,n}}
const LVLTXT=['Not tried yet','Practicing','Growing','Strong'];
const LVLCLS=['nt','p4pr','gr','st'];
const ago=t=>{if(!t)return 'Not played yet';const d=Math.floor((Date.now()-t)/864e5);return d<1?'Played today':d<2?'Played yesterday':`Played ${d} days ago`};
function summary4(p){const st=statsOf(p.id);const lvl=pget(p.id,'pbg_level',1);const badges=pget(p.id,'pbg_badges',[]).length;const stars=pget(p.id,'pbg_total',0);
 const sks=SKILLS.map(s=>({s,v:skillState(st,s.id)}));const tried=sks.filter(x=>x.v.lvl>0);
 const best=tried.slice().sort((a,b)=>b.v.lvl-a.v.lvl||(b.v.pct||0)-(a.v.pct||0))[0];const next=tried.slice().sort((a,b)=>a.v.lvl-b.v.lvl||(a.v.pct||0)-(b.v.pct||0))[0];
 return{st,lvl,badges,stars,sks,best,next,t:totals(st)}}

 ${tried.length?`<div class="card panel"><h3>This week's practice idea</h3><p style="margin:0">${tried[0].s.tip}</p><p class="note">Ask: "What did Penny teach you today?" Kids learn more when they explain it back.</p></div>`:''}
 <div class="card panel"><h3>Goals reached</h3>${x.st.goals.length?`<div class="tablewrap"><table class="gtable"><thead><tr><th>Goal</th><th>Level</th><th>Price</th><th>Days</th><th>Date</th></tr></thead><tbody>${x.st.goals.slice().reverse().map(g=>`<tr><td>${GNAME[g.goal]||g.goal}</td><td>${g.lvl}</td><td>${money(g.price)}</td><td>${g.days}</td><td data-notr>${new Date(g.date).toLocaleDateString(langInfo()[2])}</td></tr>`).join('')}</tbody></table></div>`:'<p class="note">No goals reached yet.</p>'}</div>
 <div class="card panel"><h3>Badges earned</h3>${(()=>{const b=pget(p.id,'pbg_badges',[]);return b.length?`<div class="words">${BADGE_DEF.filter(d=>b.includes(d.id)).map(d=>`<span style="background:#FFF1C2">${d.name()}</span>`).join('')}</div>`:'<p class="note">No badges yet.</p>'})()}</div>`}

/* ---------- printables ---------- */
const CHORES={young:['Make my bed','Put toys away','Feed the pet','Set the table','Water the plants','Put clothes in the hamper','Help sort the laundry','Clear my dishes'],
 older:['Make my bed','Load the dishwasher','Take out the trash','Fold laundry','Vacuum a room','Help cook dinner','Clean my room','Read for 20 minutes']};
const TALK={young:['What is something you want that costs money? How could we save for it?','Is a toy a need or a want? What about water?','Who could we help with our Give jar?','What job would you like to do to earn money?','If you had $1, how would you split it into your jars?','What is the difference between saving and spending?','Why do you think things cost money?','How did it feel when you gave something away?','How long can you wait for something you really want?','What happens to money we put in the bank?','What would you sell at your own shop?','How do grown-ups in our family earn money?'],
 older:['What would you do with $100? Why?','What business could you start with AI? Who are your customers?','How do you know if a price is fair?','What is profit, and how could you raise yours?','What should you never share online?','How can you tell if a picture was made by AI?','Why do people keep money in a bank?','What does 10% of your earnings look like?','How does saving early help money grow?','What is an impulse buy? Have you made one?','How would you budget $20 for a week?','What goal would you save for 6 months to reach?']};
const PITEMS=[['labels','Jar labels'],['chores','Chore chart'],['goal','Goal tracker'],['cert','Certificate'],['talk','Money talk cards']];
const pennyArt=()=>{const s=$('penny').outerHTML.replace(' id="penny"','').replace('class="bob"','').replace(/ id="[^"]*"/g,'');return s.replace('<svg','<svg class="pp-penny"')};
function kidOf(id){return FAM.players.find(p=>p.id===id)||me()}
function pBuild(){const k=kidOf(printSel.kid);const nm=esc(k.name);const T=x=>tr(x);const age=+k.age||0;
 const band=printSel.band||(age>=9?'older':'young');
 if(printSel.item==='labels'){const L=[];if(SET.give)L.push([giveWord(),'#5CB85C','Give first, with a happy heart']);L.push(['Save','#FFC533','For my big goal'],['Spend','#4AA3DF','For now, with a plan'],['Share','#FF8FB1','For friends and family']);
  return `<div class="pp-page"><h1>${T('My money jars')}</h1><p class="sub">${T('Cut out each label and tape it on a jar.')}</p><div class="pp-labels">${L.map(([w,c,l])=>`<div class="pp-label" style="background:${c}22">${pennyArt()}<div class="word" style="color:${c}">${T(w)}</div><div class="line">${T(l)}</div><div class="owner">${nm}</div></div>`).join('')}</div></div>`}
 if(printSel.item==='chores'){const ch=printSel.chores||CHORES[band].slice(0,6);const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  return `<div class="pp-page"><h1>${T('My chore chart')}</h1><p class="sub">${nm} · ${T('Each chore earns')} ${money(printSel.pay)} · ${T('Draw a star when it is done.')}</p>
   <table><thead><tr><th>${T('Chore')}</th>${days.map(d=>`<th>${d==='Sun'?T('Sun (day)').replace(' (day)',''):T(d)}</th>`).join('')}</tr></thead><tbody>${ch.map(c=>`<tr><td class="chore">${T(c)}</td>${days.map(()=>'<td></td>').join('')}</tr>`).join('')}
   <tr><td class="chore">${T('Stars this week')}</td><td colspan="7"></td></tr><tr><td class="chore">${T('Money earned')}</td><td colspan="7"></td></tr></tbody></table>
   <h1 style="font-size:24px">${T('Payday: split it into your jars')}</h1><div class="pp-split">${(SET.give?[giveWord()]:[]).concat(['Save','Spend','Share']).map(w=>`<div>${T(w)}<br>$______</div>`).join('')}</div></div>`}
 if(printSel.item==='goal'){const st=statsOf(k.id);const lastRun=Object.values(st.runs).sort((a,b)=>b.date-a.date)[0];
  const gName=printSel.goalName||(lastRun?(GNAME[lastRun.goal]||''):'My big goal');const gPrice=Math.max(100,Math.round((+printSel.goalPrice||20)*100));const step=Math.ceil(gPrice/20/50)*50;const n=Math.ceil(gPrice/step);
  return `<div class="pp-page"><h1>${T('My goal tracker')}</h1><p class="sub">${nm} · ${esc(T(gName))} · ${money(gPrice)}</p><div style="display:grid;place-items:center">${pennyArt().replace('class="pp-penny"','class="pp-penny" style="width:120px;height:120px"')}</div>
   <p class="sub">${T('Color one coin each time you save')} ${money(step)}.</p><div class="pp-coins">${Array.from({length:n},(_,i)=>`<div class="pp-coin">${money(Math.min(gPrice,(i+1)*step))}</div>`).join('')}</div>
   <p class="sub">${T('When every coin is colored, you reached your goal!')}</p></div>`}
 if(printSel.item==='cert'){const x=summary4(k);return `<div class="pp-page"><div class="pp-cert"><p class="sub" style="letter-spacing:.14em;text-transform:uppercase">${T('Young Stars · Starlette Program')}</p><h1>${T('Money Hero Certificate')}</h1>${pennyArt().replace('class="pp-penny"','class="pp-penny" style="width:130px;height:130px"')}
   <p class="sub">${T('This certificate is proudly presented to')}</p><div class="name">${nm}</div><p class="sub">${T('for earning, giving, saving and sharing with a big heart.')}</p>
   <div class="facts"><span>${T('Level')} ${x.lvl}: ${T(LV[x.lvl].name)}</span><span>${T('Goals reached')}: ${x.st.goals.length}</span><span>${T('Badges')}: ${x.badges}</span><span>${T('Stars')}: ${x.stars}</span></div>
   <div class="pp-sign"><div>${T('Grown-up')}</div><div>${T('Date')}: ${new Date().toLocaleDateString(langInfo()[2])}</div></div></div></div>`}
 const q=TALK[band];return `<div class="pp-page"><h1>${T('Money talk cards')}</h1><p class="sub">${T('Cut out the cards. Pick one at dinner or in the car and talk it over.')}</p>
  <div class="pp-cards">${q.map((c,i)=>`<div class="pp-card"><small>${T("Penny's question")} ${i+1}</small><p>${T(c)}</p></div>`).join('')}</div></div>`}
function printTab(){const P=FAM.players;if(!printSel.kid||!P.some(p=>p.id===printSel.kid))printSel.kid=FAM.active;const k=kidOf(printSel.kid);const age=+k.age||0;if(!printSel.band)printSel.band=age>=9?'older':'young';
 let opts='';
 if(printSel.item==='chores'){const list=CHORES[printSel.band];const sel=printSel.chores||list.slice(0,6);
  opts=`<div class="field">Chores (pick up to 8)<div class="checks">${list.map(c=>`<label><input type="checkbox" data-p4in="chore" value="${esc(c)}" ${sel.includes(c)?'checked':''}> <span>${c}</span></label>`).join('')}</div></div>
   <div class="field">Each chore earns<div class="seg" style="width:max-content">${[50,100,200].map(v=>`<button data-p4="pay:${v}" aria-pressed="${printSel.pay===v}">${money(v)}</button>`).join('')}</div></div>`}
 if(printSel.item==='goal')opts=`<div class="prow" style="grid-template-columns:1fr"><div class="grid2"><label class="field">Goal<input data-p4in="goalName" maxlength="30" value="${esc(printSel.goalName)}" placeholder="A new bike"></label><label class="field">Price in dollars<input data-p4in="goalPrice" type="number" min="1" max="1000" value="${esc(printSel.goalPrice||20)}"></label></div></div>`;
 if(printSel.item==='chores'||printSel.item==='talk')opts=`<div class="field">Ages<div class="seg" style="width:max-content"><button data-p4="band:young" aria-pressed="${printSel.band==='young'}">5–8</button><button data-p4="band:older" aria-pressed="${printSel.band==='older'}">9–13</button></div></div>`+opts;
 return `<div class="card panel noprint"><p class="note">Print at home or school. Everything prints in the language Penny is speaking now.</p>
  <div class="field">For<div class="row" style="justify-content:flex-start">${P.map(q=>`<button class="pchip" style="box-shadow:none;${q.id===printSel.kid?'background:var(--gold)':''}" data-p4="pkid:${q.id}" aria-pressed="${q.id===printSel.kid}">${av(q,24)}<span data-notr>${esc(q.name)}</span></button>`).join('')}</div></div>
  <div class="gu-tabs">${PITEMS.map(([id,n])=>`<button data-p4="pitem:${id}" aria-pressed="${printSel.item===id}">${n}</button>`).join('')}</div>${opts}
  <div class="row" style="justify-content:flex-start"><button class="btn go" data-p4="print">Print</button><button class="btn" data-p4="dlprint">Download to print</button></div>
  <p class="note" id="p4printmsg">If Print does nothing here, use Download to print and open the file.</p></div>
  <div class="printarea"><div class="pp" data-notr>${pBuild()}</div></div>`}
function printDoc(){const css=[...document.querySelectorAll('style')].map(s=>s.textContent).filter(t=>t.includes('.pp-page')).join('\n');
 const inner=GU.querySelector('.printarea').innerHTML;
 return `<!doctype html><html lang="${langInfo()[2]}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Penny's Big Goal printable</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap"><style>:root{--ink:#1A1A1A}body{margin:24px;background:#fff}.bar{text-align:center;margin-bottom:16px}.bar button{font:600 18px 'Fredoka',sans-serif;border:3px solid #1A1A1A;border-radius:14px;padding:8px 18px;background:#FFC533;cursor:pointer}@media print{.bar{display:none}body{margin:0}}${css.replace(/body>\*:not\(#gu\)\{display:none!important\}/,'')}</style></head>
<body><div class="bar"><button onclick="print()">${tr('Print')}</button></div>${inner}</body></html>`}

/* ---------- players and saving ---------- */
function playersTab(){const P=FAM.players;
 return `<div class="card panel"><h3>How will you use Penny?</h3><div class="seg" style="width:max-content"><button data-p4="mode:family" aria-pressed="${FAM.mode!=='class'}">Family</button><button data-p4="mode:class" aria-pressed="${FAM.mode==='class'}">Classroom</button></div>
  <p class="note">${FAM.mode==='class'?'Classroom: add each student. Groups help you sort by class or table. The overview becomes a class table you can download.':'Family: add each child. Each one keeps their own level, badges and progress.'}</p></div>
 <div class="card panel"><h3>${FAM.mode==='class'?'Students':'Children'}</h3>
  ${P.map(p=>`<div class="prow">${av(p,44)}<div style="display:grid;gap:8px"><div class="grid2"><label class="field">First name<input data-p4in="name:${p.id}" maxlength="20" value="${esc(p.name)}"></label>
   <label class="field">Age<select data-p4in="age:${p.id}"><option value="">—</option>${[5,6,7,8,9,10,11,12,13].map(a=>`<option ${+p.age===a?'selected':''}>${a}</option>`).join('')}</select></label>
   ${FAM.mode==='class'?`<label class="field">Group<input data-p4in="group:${p.id}" maxlength="20" value="${esc(p.group)}" placeholder="Room 4"></label>`:''}</div>
   <div class="row" style="justify-content:space-between"><div class="swatches">${AVC.map(c=>`<button style="background:${c}" data-p4="color:${p.id}:${c}" aria-pressed="${p.color===c}" aria-label="Color"></button>`).join('')}</div>
   ${P.length>1?`<button class="btn small" data-p4="del:${p.id}" style="background:${delArm===p.id?'#FFE3EC':'var(--card)'}">${delArm===p.id?'Tap again to delete':'Delete'}</button>`:''}</div></div></div>`).join('')}
  <div class="row" style="justify-content:flex-start"><input id="p4add" maxlength="20" placeholder="First name" aria-label="First name" style="font:700 16px var(--body);border:3px solid var(--ink);border-radius:12px;padding:9px 10px;flex:1;min-width:160px"><button class="btn small go" data-p4="add">${FAM.mode==='class'?'Add student':'Add child'}</button></div>
  <p class="note">Use first names or nicknames only. Deleting a player removes their progress for good.</p></div>
 <div class="card panel"><h3>Saving progress</h3>
  <div class="status"><span class="dot" style="background:${SYNC.on?C.green:C.gold}"></span><span>${SYNC.on?'Saved to your Claude account. Sign in with this account on any device to keep playing.':'Saved on this device only.'}</span></div>
  ${SYNC.on&&SYNC.at?`<p class="note">Last saved ${new Date(SYNC.at).toLocaleTimeString(langInfo()[2],{hour:'numeric',minute:'2-digit'})}</p>`:''}
  <p class="note">Progress stays private to your account. Nothing about your children is shared with anyone.</p>
  <h3>Backup code</h3><p class="note">Use a backup code to move progress to another device or browser, or to keep a safe copy.</p>
  <div class="row" style="justify-content:flex-start"><button class="btn small" data-p4="mkcode">Make a backup code</button><button class="btn small" data-p4="dlcode">Download backup file</button></div>
  <div id="p4code"></div>
  <label class="field">Restore from a backup code<textarea id="p4restore" rows="3" placeholder="Paste a code that starts with PENNY1"></textarea></label>
  <div class="row" style="justify-content:flex-start"><button class="btn small" data-p4="restore">${restoreArm?'Tap again to replace progress on this device':'Restore'}</button></div><p class="note" id="p4rmsg"></p></div>`}
let delArm=null,restoreArm=false;

/* ---------- backup + sync ---------- */
function collect(){const data={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^pbg_/.test(k)&&k!=='pbg_updated')data[k]=localStorage.getItem(k)}}catch(e){}
 return{v:1,updated:lsGet.call(LS,'pbg_updated',0),data}}
function applyBlob(b){if(!b||!b.data)return false;try{Object.keys(b.data).forEach(k=>{if(/^pbg_/.test(k))localStorage.setItem(k,b.data[k])});localStorage.setItem('pbg_updated',JSON.stringify(b.updated||Date.now()))}catch(e){return false}
 FAM=lsGet.call(LS,'pbg_family',FAM);if(!FAM.players.some(p=>p.id===FAM.active))FAM.active=FAM.players[0].id;
 SET=Object.assign({give:true,word:'Tithe',voice:false,lang:'en'},lsGet.call(LS,'pbg_settings',{}));try{syncLang();retranslate()}catch(e){}loadPlayer();return true}
const toCode=b=>'PENNY1:'+btoa(unescape(encodeURIComponent(JSON.stringify(b))));
const fromCode=s=>{s=(s||'').trim();if(!s.startsWith('PENNY1:'))return null;try{return JSON.parse(decodeURIComponent(escape(atob(s.slice(7).replace(/\s+/g,'')))))}catch(e){return null}};
const DEV='d'+Math.random().toString(36).slice(2,8);
const SYNC={on:false,doc:null,at:0,t:0};let pendingApply=null;
function touch(){try{localStorage.setItem('pbg_updated',JSON.stringify(Date.now()))}catch(e){}if(SYNC.on){clearTimeout(SYNC.t);SYNC.t=setTimeout(push,2500)}}
async function push(){if(!SYNC.doc)return;try{const b=collect();b.dev=DEV;await SYNC.doc.set(b);SYNC.at=Date.now()}catch(e){}}
function applyRemote(b){pendingApply=null;if(applyBlob(b)&&!GU.hidden)render4()}
(async()=>{if(!window.claude||!claude.use)return;try{const user=await claude.use('user');const db=await claude.use('db');if(!user||!db)return;const uid=await user.id();if(!uid)return;
 SYNC.doc=db.doc('data/users/'+uid+'/pennyfamily');const snap=await SYNC.doc.get();SYNC.on=true;const local=lsGet.call(LS,'pbg_updated',0);
 if(snap.exists){const b=snap.data();if((b.updated||0)>local){if(S&&S.goal)pendingApply=b;else{applyBlob(b);title()}}else if(local>(b.updated||0))push()}else push();
 SYNC.doc.onSnapshot(s=>{if(!s.exists||s.metadata.hasPendingWrites)return;const b=s.data();if(b.dev===DEV)return;if((b.updated||0)>lsGet.call(LS,'pbg_updated',0)){if(S&&S.goal)pendingApply=b;else{applyBlob(b);if(GU.hidden)title();else render4()}}},()=>{});
 if(!GU.hidden&&guTab==='players')render4()}catch(e){}})();

/* ---------- CSV report ---------- */
function csv(){const H=['Name','Group','Age','Level','Stars','Badges','Goals reached','Days played','Earned','Given','Shared','Saved'].concat(SKILLS.map(s=>s.name)).concat(['Last played']);
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const rows=FAM.players.map(p=>{const x=summary4(p);const t=x.t;return [p.name,p.group||'',p.age||'',x.lvl,x.stars,x.badges,x.st.goals.length,x.st.days.length,money(t.earned),money(t.given),money(t.shared),money(t.saved)]
  .concat(x.sks.map(s=>tr(LVLTXT[s.v.lvl])+(s.v.pct!=null?` (${s.v.pct}%)`:''))).concat([x.st.last?new Date(x.st.last).toLocaleDateString():''])});
 return [H.map(h=>q(tr(h)))].concat(rows.map(r=>r.map(q))).map(r=>r.join(',')).join('\r\n')}
async function save4(filename,data,msgEl){let dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){dl=null}
 if(dl){try{await dl.save({filename,data});return}catch(e){if(e&&e.code==='declined')return}}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:filename.endsWith('.csv')?'text/csv':filename.endsWith('.json')?'application/json':'text/html'}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
 catch(e){if(msgEl)msgEl.textContent=tr('Downloads are not available here.')}}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-p4]');if(!b)return;const [a,v,w]=b.dataset.p4.split(':');
 if(a==='who')return whoPicker();
 if(a==='gu')return guOpen();
 if(a==='close')return guClose();
 if(a==='pick')return pickPlayer(v);
 if(a==='addquick'){const p=addPlayer($('p4new').value);if(p)pickPlayer(p.id);return}
 if(a==='gate'){if(+v===gateQ){gateOK=true;render4()}else{b.classList.add('shake');b.disabled=true}return}
 if(a==='tab'){guTab=v;delArm=null;restoreArm=false;return render4()}
 if(a==='kid'){guKid=v;guTab='kid';return render4()}
 if(a==='csv')return save4('penny-class-report.csv',csv());
 if(a==='pitem'){printSel.item=v;return render4()}
 if(a==='pkid'){printSel.kid=v;const k=kidOf(v);printSel.band=+k.age>=9?'older':'young';printSel.chores=null;return render4()}
 if(a==='band'){printSel.band=v;printSel.chores=null;return render4()}
 if(a==='pay'){printSel.pay=+v;return render4()}
 if(a==='print'){try{window.print()}catch(err){}return}
 if(a==='dlprint')return save4(`penny-${printSel.item}.html`,printDoc(),$('p4printmsg'));
 if(a==='mode'){FAM.mode=v;saveFam();return render4()}
 if(a==='color'){const p=FAM.players.find(x=>x.id===v);if(p){p.color=w;saveFam();render4()}return}
 if(a==='del'){if(delArm!==v){delArm=v;return render4()}const i=FAM.players.findIndex(x=>x.id===v);if(i<0||FAM.players.length<2)return;FAM.players.splice(i,1);
  PER.forEach(k=>{try{localStorage.removeItem(k+'@'+v)}catch(err){}});if(FAM.active===v){FAM.active=FAM.players[0].id;loadPlayer()}delArm=null;saveFam();return render4()}
 if(a==='add'){const p=addPlayer($('p4add').value);if(p)render4();return}
 if(a==='mkcode'){$('p4code').innerHTML=`<label class="field">Your backup code<textarea readonly rows="4" data-notr>${esc(toCode(collect()))}</textarea></label><button class="btn small" data-p4="copy">Copy code</button>`;return}
 if(a==='copy'){const t=$('p4code').querySelector('textarea');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast(tr('Copied!')),()=>{})}catch(err){}return}
 if(a==='dlcode')return save4('penny-backup.json',JSON.stringify(collect()));
 if(a==='restore'){const raw=$('p4restore').value.trim();let blob=fromCode(raw);if(!blob){try{const j=JSON.parse(raw);if(j&&j.data)blob=j}catch(err){}}
  if(!blob){restoreArm=false;$('p4rmsg').textContent=tr('That code did not work. Check that you copied all of it.');return}
  if(!restoreArm){restoreArm=true;b.textContent=tr('Tap again to replace progress on this device');$('p4rmsg').textContent=tr('This replaces the players and progress on this device.');return}
  restoreArm=false;applyBlob(blob);touch();toast(tr('Progress restored!'));guTab='home';return render4()}
});
GU.addEventListener('change',e=>{const el=e.target.closest('[data-p4in]');if(!el)return;const [a,id]=el.dataset.p4in.split(':');
 if(a==='chore'){const sel=[...GU.querySelectorAll('[data-p4in="chore"]:checked')].map(x=>x.value).slice(0,8);printSel.chores=sel.length?sel:null;return render4()}
 if(a==='goalName'){printSel.goalName=el.value;return render4()}
 if(a==='goalPrice'){printSel.goalPrice=el.value;return render4()}
 const p=FAM.players.find(x=>x.id===id);if(!p)return;
 if(a==='name'){const v=el.value.trim().slice(0,20);if(v)p.name=v}
 if(a==='age')p.age=el.value;if(a==='group')p.group=el.value.trim().slice(0,20);saveFam();render4()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!GU.hidden)guClose()});
title();

</script>
